name: Request the Pilot Kit
description: Register interest in the One Agent Stack Pilot Kit.
title: "Pilot Kit request"
body:
  - type: markdown
    attributes:
      value: "Requests and replies are public. Do not include names, email addresses, phone numbers, account details or secrets. This request is not a purchase."
  - type: dropdown
    id: organisation-type
    attributes:
      label: Organisation type
      options:
        - Solo operator
        - Small service business
        - Other organisation
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Need
      description: Describe the workflow you want to test. Use general terms without private information.
    validations:
      required: true
  - type: dropdown
    id: contact-channel
    attributes:
      label: Preferred contact channel
      description: Select a channel only. Do not include contact details. Only public issue replies are available at present.
      options:
        - Public reply on this GitHub issue
        - Private contact if available later
    validations:
      required: true
